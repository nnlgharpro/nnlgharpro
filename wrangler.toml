name = "nnlgharpro-ret11"
main = "src/index.js"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "preprod"
ONDC_DOMAIN = "ONDC:RET11"

# Workbench "Send your calls to" ka base (action code mein judta hai: /search, /select ...)
ONDC_GATEWAY_URL = "https://workbench.ondc.tech/api-service/ONDC:RET11/1.2.5/seller"

# Workbench "Subscriber ID" - gear icon (Settings) se confirm karein.
# NOTE: Ye Session ID nahi hai. Agar settings mein alag subscriber ID hai to wahi daalein.
ONDC_BAP_ID = "nnlgharpro-ret11.nnlgharpro.workers.dev"
ONDC_BAP_URI = "https://nnlgharpro-ret11.nnlgharpro.workers.dev"

# Context mein jaane wala version. Workbench ke sample payload se match karein.
ONDC_CORE_VERSION = "1.2.0"

ONDC_UK_ID = "05063c66-41f2-4f75-878a-22f28d07712a"
ONDC_SIGNING_PUBLIC_KEY = "ONGFJUVn9K609lH0a+xA1RVeMG+PL5KtrpcCiJFhV08="

# Private key yahan kabhi nahi. Ye command chalayein:
#   npx wrangler secret put ONDC_PRIVATE_KEY

[[kv_namespaces]]
binding = "ONDC_DATA"
id = "2a7cea28b17f448eb9477bbe6df4e646"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
