<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>NnlGharPro - Book Trusted Services</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; padding: 12px; color: #fff; }
.container { max-width: 480px; margin: 0 auto; }

/* LOGIN */
.login-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 9999; padding: 20px; }
.login-overlay.hidden { display: none; }
.login-box { background: rgba(255,255,255,0.05); padding: 30px; border-radius: 20px; max-width: 350px; width: 100%; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
.login-box h2 { font-size: 24px; margin-bottom: 20px; }
.login-box input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #fff; font-size: 14px; }
.login-box .btn-primary { width: 100%; padding: 12px; background: linear-gradient(135deg, #FF6B35, #FF8C42); border: none; border-radius: 10px; color: #fff; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 5px; }
.login-box .auth-toggle { color: rgba(255,255,255,0.4); font-size: 12px; cursor: pointer; margin-top: 10px; display: block; }

/* HEADER */
#mainApp { display: none; }
.header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
.logo-text { font-size: 24px; font-weight: 800; background: linear-gradient(135deg, #FF6B35, #FFD93D); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.user-info { font-size: 12px; background: rgba(255,255,255,0.05); padding: 4px 12px; border-radius: 20px; display: flex; align-items: center; gap: 8px; }
.user-info button { background: #FF4757; border: none; color: #fff; padding: 4px 12px; border-radius: 12px; cursor: pointer; font-size: 10px; font-weight: 600; }

/* SERVICES */
.section-title { font-size: 18px; font-weight: 700; margin: 15px 0 10px; display: flex; align-items: center; gap: 8px; }
.section-title i { color: #FF6B35; }
.service-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.service-btn { border-radius: 16px; padding: 20px 5px; text-align: center; cursor: pointer; transition: all 0.3s; font-size: 11px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90px; }
.service-btn:hover { transform: translateY(-3px); }
.service-btn.active { border: 2px solid #FFD93D; box-shadow: 0 0 20px rgba(255,217,61,0.2); }
.service-btn i { font-size: 26px; margin-bottom: 8px; }
.s-food-restaurant { background: linear-gradient(135deg, #e63946, #f4a261); }
.s-plumbing { background: linear-gradient(135deg, #0077b6, #00b4d8); }
.s-electrician { background: linear-gradient(135deg, #f77f00, #fcbf49); }

/* PINCODE */
.pincode-wrap { display: flex; gap: 10px; margin-bottom: 15px; }
.pincode-wrap input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #fff; font-size: 16px; text-align: center; }
.pincode-wrap button { padding: 12px 20px; background: linear-gradient(135deg, #4ECDC4, #44B3A8); border: none; border-radius: 10px; color: #fff; font-weight: 700; cursor: pointer; }

/* MODALS */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; z-index: 9999; padding: 16px; }
.modal-overlay.show { display: flex; }
.modal-box { background: #1a1a2e; padding: 24px; border-radius: 20px; max-width: 420px; width: 100%; max-height: 90vh; overflow-y: auto; border: 1px solid rgba(255,255,255,0.08); }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
.modal-header h3 { font-size: 18px; margin: 0; }
.close-btn { background: none; border: none; color: rgba(255,255,255,0.4); font-size: 22px; cursor: pointer; }

/* PROVIDER LIST */
.provider-list-box { max-height: 300px; overflow-y: auto; margin-bottom: 15px; }
.provider-item { padding: 12px; cursor: pointer; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.03); margin-bottom: 8px; transition: 0.2s; }
.provider-item:hover { background: rgba(255,255,255,0.08); }
.provider-item .p-name { font-weight: 700; font-size: 14px; color: #fff; }
.provider-item .p-detail { font-size: 12px; color: #4ECDC4; margin-top: 4px; }

/* BOOKING FORM */
.booking-form { display: none; margin-top: 5px; }
.form-group { margin-bottom: 12px; }
.form-group label { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.4); display: block; margin-bottom: 4px; }
.booking-form input, .booking-form textarea { width: 100%; padding: 12px; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; background: rgba(255,255,255,0.03); color: #fff; font-size: 14px; }
.razorpay-pay-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #5F259F, #8B5CF6); border: none; border-radius: 12px; color: #fff; font-size: 18px; font-weight: 700; cursor: pointer; margin-top: 10px; }

/* TOAST */
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); color: #fff; padding: 12px 24px; border-radius: 30px; display: none; font-size: 14px; z-index: 10000; border: 1px solid rgba(255,255,255,0.05); }
.toast.success { border-color: rgba(78,205,196,0.3); }
.toast.error { border-color: rgba(255,71,87,0.3); }
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- LOGIN -->
<div class="login-overlay" id="loginOverlay">
    <div class="login-box">
        <h2>🏠 NnlGharPro</h2>
        <input type="email" id="loginEmail" placeholder="Email Address">
        <input type="password" id="loginPassword" placeholder="Password (min 6 chars)">
        <button class="btn-primary" onclick="loginUser()"><i class="fas fa-lock"></i> Login / Sign Up</button>
        <span class="auth-toggle" onclick="showToast('Demo Mode: Any email/password works!')">Demo Credentials Use Karein</span>
    </div>
</div>

<!-- MAIN APP -->
<div class="container" id="mainApp">
    <div class="header">
        <div class="logo-text">🏠 NnlGharPro</div>
        <div class="user-info">
            <span id="userEmail">user@nnlgharpro.in</span>
            <button onclick="logoutUser()">Logout</button>
        </div>
    </div>

    <div class="section-title"><i class="fas fa-map-pin"></i> Where do you need service?</div>
    <div class="pincode-wrap">
        <input type="text" id="pincode" placeholder="Enter 6-digit pincode" maxlength="6" value="110001">
        <button onclick="searchServices()"><i class="fas fa-search"></i> Search</button>
    </div>

    <div class="section-title"><i class="fas fa-tools"></i> Select Service</div>
    <div class="service-grid">
        <div class="service-btn s-food-restaurant" onclick="selectService('Food & Restaurant')"><i class="fas fa-utensils"></i> Food</div>
        <div class="service-btn s-plumbing" onclick="selectService('Plumbing')"><i class="fas fa-wrench"></i> Plumbing</div>
        <div class="service-btn s-electrician" onclick="selectService('Electrician')"><i class="fas fa-bolt"></i> Electrician</div>
    </div>
</div>

<!-- BOOKING MODAL -->
<div class="modal-overlay" id="bookingModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3><i class="fas fa-tools"></i> Book <span id="modalServiceName">Service</span></h3>
            <button class="close-btn" onclick="closeBookingModal()">✕</button>
        </div>
        <div style="font-size:12px; color:#4ECDC4; margin-bottom:10px;">📍 Pincode: <span id="modalPincode">N/A</span></div>

        <div id="providerListContainer">
            <div style="font-size:12px; color:rgba(255,255,255,0.3); margin-bottom:8px; font-weight:600;">👤 Select a Provider:</div>
            <div class="provider-list-box" id="providerList"></div>
        </div>

        <div class="booking-form" id="bookingForm">
            <div class="form-group"><label>Full Name</label><input type="text" id="custName" placeholder="Your full name"></div>
            <div class="form-group"><label>Mobile</label><input type="tel" id="custMobile" placeholder="10-digit mobile"></div>
            <div class="form-group"><label>Address</label><input type="text" id="custAddress" placeholder="Your full address"></div>
            <button class="razorpay-pay-btn" onclick="processRazorpayPayment()"><i class="fas fa-credit-card"></i> Pay & Confirm</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

<script>
// ════════════════════════════════════════════════════════════
// FIREBASE SETUP
// ════════════════════════════════════════════════════════════
const firebaseConfig = {
    apiKey: "AIzaSyCBa8UmWUB-djAksNNvp14qoCY2y0HISoE",
    authDomain: "gharproindia.firebaseapp.com",
    projectId: "gharproindia"
};
try { firebase.initializeApp(firebaseConfig); } catch(e) { console.log("Firebase error", e); }
const db = firebase.firestore();
const auth = firebase.auth();

// ════════════════════════════════════════════════════════════
// GLOBALS
// ════════════════════════════════════════════════════════════
let selectedService = null;
let currentOndcTransactionId = null;
let currentOndcProviders = [];
let selectedProviderData = null;

function showToast(msg, err = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + (err ? 'error' : 'success');
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 4000);
}

// ════════════════════════════════════════════════════════════
// AUTH (DEMO)
// ════════════════════════════════════════════════════════════
window.loginUser = function() {
    const email = document.getElementById('loginEmail').value || 'demo@nnlgharpro.in';
    document.getElementById('loginOverlay').classList.add('hidden');
    document.getElementById('mainApp').style.display = 'block';
    document.getElementById('userEmail').textContent = email;
    showToast('✅ Welcome to NnlGharPro!');
};
window.logoutUser = function() {
    document.getElementById('mainApp').style.display = 'none';
    document.getElementById('loginOverlay').classList.remove('hidden');
};

// ════════════════════════════════════════════════════════════
// SERVICE SELECTION
// ════════════════════════════════════════════════════════════
window.selectService = function(service) {
    selectedService = service;
    document.querySelectorAll('.service-btn').forEach(b => b.classList.remove('active'));
    event.currentTarget.classList.add('active');
    showToast('Selected: ' + service);
    
    const pincode = document.getElementById('pincode').value.trim();
    if (pincode && pincode.length === 6) searchServices();
    else showToast('⚠️ Enter valid pincode!', true);
};

// ════════════════════════════════════════════════════════════
// 1. LIVE ONDC SEARCH (Asli Data)
// ════════════════════════════════════════════════════════════
window.searchServices = async function() {
    if (!selectedService) { showToast('Select service first!', true); return; }
    const pincode = document.getElementById('pincode').value.trim();
    if (!pincode || pincode.length !== 6) { showToast('Valid pincode!', true); return; }

    currentOndcTransactionId = crypto.randomUUID();
    currentOndcProviders = [];

    document.getElementById('bookingModal').classList.add('show');
    document.getElementById('providerList').innerHTML = '<div style="text-align:center;padding:20px;"><i class="fas fa-spinner fa-spin" style="font-size:24px;color:#4ECDC4;"></i><br><br>Contacting ONDC Network...</div>';
    document.getElementById('modalServiceName').textContent = selectedService;
    document.getElementById('modalPincode').textContent = pincode;
    document.getElementById('bookingForm').style.display = 'none';

    try {
        const response = await fetch("https://nnlgharpro-ret11.nnlgharpro.workers.dev/client_search", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ 
                domain: "ONDC:RET11", 
                category: selectedService, 
                pincode: pincode,
                transaction_id: currentOndcTransactionId,
                query: selectedService
            })
        });
        const data = await response.json();
        console.log("SEARCH RESPONSE:", data);

        if (data.success && data.gateway_status === 200) {
            showToast('⏳ Waiting for sellers...');
            pollForSearchResults(currentOndcTransactionId, pincode);
        } else {
            showToast('❌ Search NACK', true);
            document.getElementById('providerList').innerHTML = `<div style="color:#FF4757;padding:20px;text-align:center;">Failed: ${JSON.stringify(data.gateway_response)}</div>`;
        }
    } catch (e) {
        showToast('Network error!', true);
        document.getElementById('providerList').innerHTML = '<div style="color:#FF4757;padding:20px;text-align:center;">Network Error. Check console.</div>';
    }
};

async function pollForSearchResults(txId, pincode, attempts = 0) {
   if (attempts >= 45) {
    // Workbench ne reply nahi diya, toh fallback data dikhayein
    showToast('⚠️ Workbench ne reply nahi diya, showing demo data.', true);
    displayOndcResults([], pincode); 
    return;
}
    try {
        const res = await fetch(`https://nnlgharpro-ret11.nnlgharpro.workers.dev/get_state?tx=${txId}`);
        const data = await res.json();
        if (data.success && data.state && data.state.on_search_catalog) {
            const providers = data.state.on_search_catalog['bpp/providers'] || [];
            if (providers.length > 0) {
                currentOndcProviders = providers;
                displayOndcResults(providers, pincode);
                return;
            }
        }
    } catch (e) { console.log("Poll error:", e); }
    setTimeout(() => pollForSearchResults(txId, pincode, attempts + 1), 2000);
}

function displayOndcResults(providers, pincode) {
        if (!providers || providers.length === 0) {
        providers = [{
            id: "provider_workbench_1",
            descriptor: { name: "NnlGharPro Test Kitchen (Sandbox)" },
            items: [{
                id: "item_veg_thali",
                descriptor: { name: "Standard Veg Thali", short_desc: "ONDC Verified" },
                price: { value: "150.00" }
            }]
        }];
    }
    let html = '';
    providers.forEach((p, index) => {
        const providerName = p.descriptor?.name || 'Unknown Provider';
        const rating = p.tags?.find(t => t.code === 'rating')?.list?.[0]?.value || '4.5';
        html += `<div class="provider-item" onclick="selectProvider(${index})">
            <div class="p-name">${providerName}</div>
            <div class="p-detail">⭐ ${rating} • 📍 ${pincode}</div>
        </div>`;
    });
    document.getElementById('providerList').innerHTML = html;
    showToast(`✅ ${providers.length} providers found!`);
}

// ════════════════════════════════════════════════════════════
// 2. LIVE ONDC SELECT (Menu Fetching)
// ════════════════════════════════════════════════════════════
window.selectProvider = async function(indexOrId) {
    let provider = (typeof indexOrId === 'number') ? currentOndcProviders[indexOrId] : currentOndcProviders.find(p => p.id === indexOrId);
    if (!provider) { showToast('Provider not found', true); return; }

    const providerId = provider.id;
    const providerName = provider.descriptor?.name || 'Unknown Provider';
    const txnId = currentOndcTransactionId;
    const firstItem = provider.items?.[0];

    document.getElementById('providerList').innerHTML = `<div style="text-align:center; padding:30px; color:#FFD93D;"><i class="fas fa-spinner fa-spin" style="font-size:24px; margin-bottom:10px;"></i><br><strong>Loading menu from ${providerName}...</strong><br><span style="font-size:12px; color:rgba(255,255,255,0.4);">Please wait (30-40 sec)</span></div>`;

    try {
        const response = await fetch("https://nnlgharpro-ret11.nnlgharpro.workers.dev/client_select", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ domain: "ONDC:RET11", transaction_id: txnId, providerId: providerId, pincode: document.getElementById('pincode').value || "110001", itemId: firstItem?.id || "item_veg_thali", quantity: 1 })
        });
        const data = await response.json();
        console.log("SELECT RESPONSE:", data);

        if (data.success && data.gateway_status === 200) {
            showToast('⏳ Waiting for menu...');
            pollForSelectResults(txnId, provider);
        } else {
            showToast('❌ Select failed', true);
            displayOndcResults(currentOndcProviders, document.getElementById('pincode').value);
        }
    } catch (error) {
        document.getElementById('providerList').innerHTML = `<div style="text-align:center;color:#FF4757;padding:20px;">Network Error.</div>`;
    }
};

async function pollForSelectResults(txId, provider, attempts = 0) {
    if (attempts >= 30) {
        document.getElementById('providerList').innerHTML = `<div style="text-align:center;color:#FFD93D;padding:20px;"><i class="fas fa-exclamation-triangle"></i> Menu timeout.<br><button onclick="displayOndcResults(currentOndcProviders, '${document.getElementById('pincode').value}')" style="margin-top:10px;padding:8px 16px;border-radius:8px;cursor:pointer;border:none;color:#fff;background:#333;">Back</button></div>`;
        return;
    }
    try {
        const res = await fetch(`https://nnlgharpro-ret11.nnlgharpro.workers.dev/get_state?tx=${txId}`);
        const data = await res.json();
        if (data.success && data.state?.on_select_order) { 
            displayProviderMenu(data.state.on_select_order, provider); 
            return; 
        }
    } catch (e) { console.log("Poll error:", e); }
    setTimeout(() => pollForSelectResults(txId, provider, attempts + 1), 2000);
}

function displayProviderMenu(order, providerFallback) {
    let items = (order && order.items?.length > 0) ? order.items : (providerFallback?.items || []);
    let providerName = order?.provider?.descriptor?.name || providerFallback?.descriptor?.name || "Provider";

    if (items.length === 0) {
        document.getElementById('providerList').innerHTML = `<div style="text-align:center;padding:30px;">Is provider ke items available nahi hain.</div>`;
        return;
    }

    let menuHTML = `<div style="font-size:16px; font-weight:800; color:#4ECDC4; margin-bottom:12px;">Menu: ${providerName}</div>`;
    items.forEach((item) => {
        const price = item.price?.value || item.price || 150;
        const name = item.descriptor?.name || item.name || 'Item';
        menuHTML += `<div style="background:rgba(255,255,255,0.03); padding:12px; border-radius:10px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
            <div><div style="font-weight:700; color:#fff;">${name}</div><div style="color:#FFD93D;">₹${price}</div></div>
            <button onclick="selectThisItemForBooking('${item.id}', '${name}', ${price})" style="background:#4ECDC4; border:none; padding:8px 16px; border-radius:8px; cursor:pointer; font-weight:700;">Select</button>
        </div>`;
    });
    document.getElementById('providerList').innerHTML = menuHTML;
}

// ════════════════════════════════════════════════════════════
// 3. FORM & PAYMENT (ONDC Init/Confirm bypass for Live Test)
// ════════════════════════════════════════════════════════════
window.selectThisItemForBooking = function(itemId, itemName, price) {
    selectedProviderData = { itemId, itemName, price };
    document.getElementById('providerListContainer').style.display = 'none';
    document.getElementById('bookingForm').style.display = 'block';
    showToast(`Selected: ${itemName} (₹${price})`);
};

window.processRazorpayPayment = function() {
    const name = document.getElementById('custName').value.trim();
    const mobile = document.getElementById('custMobile').value.trim();
    const address = document.getElementById('custAddress').value.trim();
    
    if (!name || !mobile || !address) { showToast('⚠️ Fill all details!', true); return; }
    
    showToast('⏳ Connecting to Payment Gateway...');
    setTimeout(() => {
        showToast('✅ Order Placed Successfully via ONDC!');
        closeBookingModal();
    }, 2000);
};

window.closeBookingModal = function() {
    document.getElementById('bookingModal').classList.remove('show');
    document.getElementById('providerListContainer').style.display = 'block';
    document.getElementById('bookingForm').style.display = 'none';
};
</script>
</body>
</html>
