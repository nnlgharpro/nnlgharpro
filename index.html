<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>NnlGharPro - Premium App</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root { --primary: #FF6B35; --secondary: #4ECDC4; --bg: #0f0c29; --card: rgba(255,255,255,0.06); }
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
body { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; color: #fff; overflow-x: hidden; }
.container { max-width: 480px; margin: 0 auto; padding: 15px; }

/* HEADER & SEARCH */
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; margin-top: 20px;}
.logo { font-size: 24px; font-weight: 800; background: linear-gradient(135deg, var(--primary), #FFD93D); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.icon-btn { background: var(--card); padding: 12px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; }
.icon-btn i { font-size: 18px; color: var(--secondary); }
.search-bar { display: flex; gap: 10px; margin-bottom: 25px; }
.search-bar input { flex: 1; padding: 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); background: var(--card); color: #fff; font-size: 14px; outline: none; }
.search-bar button { padding: 14px 20px; background: linear-gradient(135deg, var(--secondary), #44B3A8); border: none; border-radius: 14px; color: #fff; font-weight: 600; cursor: pointer; }

/* SECTION TITLES */
.section-title { font-size: 16px; font-weight: 600; margin-bottom: 15px; color: #fff; display: flex; align-items: center; gap: 8px; }
.section-title i { color: var(--primary); }

/* 🌟 NEW PREMIUM GRID LAYOUT 🌟 */
.services-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr); /* 4 Icons in a row */
    gap: 15px 10px;
    margin-bottom: 30px;
}

.grid-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    transition: transform 0.2s;
}

.grid-card:active { transform: scale(0.95); } /* Click effect */

/* Icon Circle */
.icon-circle {
    width: 60px;
    height: 60px;
    border-radius: 20px; /* Squircle shape */
    background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.03));
    border: 1px solid rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
    position: relative;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.icon-circle i {
    font-size: 26px;
    color: #FFD93D; /* Premium Gold */
}

/* Coming Soon Style (Faded & Grey) */
.grid-card.coming-soon .icon-circle {
    background: rgba(255,255,255,0.02);
    border: 1px dashed rgba(255,255,255,0.2);
    opacity: 0.6;
}
.grid-card.coming-soon .icon-circle i {
    color: #888; /* Grey icon */
}
.grid-card.coming-soon span {
    color: #888;
}

/* Red Soon Badge */
.soon-badge {
    position: absolute;
    top: -5px;
    right: -5px;
    background: linear-gradient(135deg, #FF4757, #ff6b81);
    color: #fff;
    font-size: 8px;
    font-weight: 700;
    padding: 3px 6px;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(255,71,87,0.4);
}

.grid-card span {
    font-size: 11px;
    font-weight: 500;
    color: #eee;
    line-height: 1.2;
}

/* TOAST */
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--secondary); color: #000; padding: 12px 24px; border-radius: 30px; font-weight: 600; font-size: 13px; z-index: 99999; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
</style>
</head>
<body>

<div class="toast" id="toast">Message</div>

<div class="container">
    <div class="header">
        <div class="logo">NnlGharPro</div>
        <div class="icon-btn"><i class="fas fa-shopping-cart"></i></div>
    </div>

    <div class="search-bar">
        <input type="text" id="pincode" placeholder="Enter Pincode" maxlength="6" value="110001">
        <button><i class="fas fa-search"></i></button>
    </div>

    <div class="section-title"><i class="fas fa-th-large"></i> Our Services</div>
    
    <!-- 🌟 NEW GRID START 🌟 -->
    <div class="services-grid">
        
        <!-- Active Services -->
        <div class="grid-card" onclick="showToast('Food Selected')">
            <div class="icon-circle"><i class="fas fa-utensils" style="color: #FF6B35;"></i></div>
            <span>Food</span>
        </div>
        
        <div class="grid-card" onclick="showToast('Grocery Selected')">
            <div class="icon-circle"><i class="fas fa-shopping-basket" style="color: #4ECDC4;"></i></div>
            <span>Grocery</span>
        </div>

        <div class="grid-card" onclick="showToast('Fashion Selected')">
            <div class="icon-circle"><i class="fas fa-tshirt" style="color: #9b5de5;"></i></div>
            <span>Fashion</span>
        </div>

        <div class="grid-card" onclick="showToast('Electronics Selected')">
            <div class="icon-circle"><i class="fas fa-laptop" style="color: #00b4d8;"></i></div>
            <span>Electronics</span>
        </div>

        <!-- Coming Soon Services -->
        <div class="grid-card coming-soon" onclick="showComingSoon('Mobility')">
            <div class="icon-circle">
                <span class="soon-badge">Soon</span>
                <i class="fas fa-taxi"></i>
            </div>
            <span>Mobility</span>
        </div>

        <div class="grid-card coming-soon" onclick="showComingSoon('Logistics')">
            <div class="icon-circle">
                <span class="soon-badge">Soon</span>
                <i class="fas fa-truck"></i>
            </div>
            <span>Logistics</span>
        </div>

        <div class="grid-card coming-soon" onclick="showComingSoon('Loans')">
            <div class="icon-circle">
                <span class="soon-badge">Soon</span>
                <i class="fas fa-hand-holding-usd"></i>
            </div>
            <span>Loans</span>
        </div>

        <div class="grid-card coming-soon" onclick="showComingSoon('Travel')">
            <div class="icon-circle">
                <span class="soon-badge">Soon</span>
                <i class="fas fa-plane"></i>
            </div>
            <span>Travel</span>
        </div>

    </div>
    <!-- 🌟 NEW GRID END 🌟 -->

</div>

<script>
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2500);
}

function showComingSoon(serviceName) {
    showToast(`${serviceName} service coming soon! 🚀`);
}
</script>
</body>
</html>
