<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>NnlGharPro - Super App</title>
<meta name="google-site-verification" content="w6qm7tonraRh8hHgflqJmZaubqzFv7_CYz-vrh1Zbmw" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { background: #0f0c29; background: linear-gradient(to right, #24243e, #302b63, #0f0c29); min-height: 100vh; color: #fff; padding: 12px; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
.container { max-width: 480px; margin: 0 auto; display: none; }
.container.active { display: block; }
input, textarea { -webkit-user-select: text; user-select: text; }

/* LOGIN */
.login-screen { position: fixed; inset: 0; background: #0f0c29; display: flex; justify-content: center; align-items: center; z-index: 9999; padding: 20px; }
.login-box { background: rgba(255,255,255,0.05); padding: 25px; border-radius: 20px; width: 100%; max-width: 350px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
.login-box h2 { margin-bottom: 20px; font-size: 24px; }
.login-box input { width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: #fff; outline: none; font-size: 15px; }
.login-box button { width: 100%; padding: 14px; background: linear-gradient(135deg, #FF6B35, #FF8C42); border: none; border-radius: 10px; color: #fff; font-weight: 700; font-size: 16px; cursor: pointer; }
.login-box p { margin-top: 15px; font-size: 12px; color: #4ECDC4; cursor: pointer; }

/* HEADER */
.header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; margin-bottom: 10px; }
.logo { font-size: 22px; font-weight: 800; background: linear-gradient(135deg, #FF6B35, #FFD93D); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.cart-icon { position: relative; cursor: pointer; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 50%; }
.cart-icon i { font-size: 18px; color: #4ECDC4; }
.cart-badge { position: absolute; top: -5px; right: -5px; background: #FF4757; color: #fff; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 10px; display: none; }

/* SERVICES GRID */
.service-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
.service-btn { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 12px 5px; text-align: center; cursor: pointer; transition: 0.2s; }
.service-btn:active { transform: scale(0.95); }
.service-btn i { font-size: 20px; margin-bottom: 6px; display: block; color: #FF6B35; }
.service-btn span { font-size: 10px; font-weight: 600; color: #ccc; }

/* MODALS */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: flex-end; z-index: 9998; }
.modal.show { display: flex; }
.modal-content { background: #1a1a2e; width: 100%; max-width: 480px; border-radius: 20px 20px 0 0; padding: 20px; max-height: 90vh; overflow-y: auto; animation: slideUp 0.2s ease-out; }
@keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
.close-btn { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }

/* CART ITEMS */
.cart-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); padding: 12px; border-radius: 10px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.05); }
.qty-control { display: flex; align-items: center; gap: 10px; background: rgba(78,205,196,0.1); padding: 2px 8px; border-radius: 6px; }
.qty-btn { background: none; border: none; color: #4ECDC4; font-size: 16px; font-weight: 800; cursor: pointer; }
.qty-num { font-weight: 700; font-size: 13px; }
.btn-primary { background: linear-gradient(135deg, #4ECDC4, #44B3A8); border: none; padding: 12px 20px; border-radius: 8px; color: #fff; font-weight: 700; cursor: pointer; }
.btn-pay { background: linear-gradient(135deg, #5F259F, #8B5CF6); width: 100%; padding: 14px; font-size: 16px; border-radius: 10px; border: none; color: #fff; font-weight: 700; margin-top: 15px; }

/* RECHARGE */
.op-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
.op-card { background: rgba(255,255,255,0.05); padding: 10px 5px; border-radius: 8px; text-align: center; cursor: pointer; border: 1px solid transparent; }
.op-card.active { border-color: #4ECDC4; background: rgba(78,205,196,0.1); }
.op-card img { height: 25px; border-radius: 5px; margin-bottom: 5px; }
.op-card div { font-size: 10px; font-weight: 600; }

/* INSURANCE */
.ins-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ins-card { background: rgba(255,255,255,0.03); padding: 12px 5px; border-radius: 10px; text-align: center; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
.ins-card i { font-size: 20px; color: #FFD93D; margin-bottom: 5px; display: block; }
.ins-card span { font-size: 10px; }

/* TOAST & RECEIPT */
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #4ECDC4; color: #000; padding: 10px 20px; border-radius: 20px; font-weight: 700; font-size: 13px; z-index: 99999; display: none; }
.receipt { background: #fff; color: #333; padding: 20px; border-radius: 16px; max-width: 350px; margin: auto; margin-top: 20vh; }
.receipt h2 { text-align: center; color: #1a237e; margin-bottom: 15px; }
.receipt .row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13px; border-bottom: 1px dashed #ddd; }
.receipt .total { font-size: 18px; font-weight: 800; color: #1a237e; border-top: 2px solid #333; padding-top: 10px; margin-top: 10px; }
</style>
</head>
<body>

<div class="toast" id="toast">Message</div>

<!-- 🔴 LOGIN SCREEN -->
<div class="login-screen" id="loginScreen">
    <div class="login-box">
        <h2>NnlGharPro</h2>
        <input type="email" id="loginEmail" placeholder="Email Address">
        <input type="password" id="loginPassword" placeholder="Password (min 6 chars)">
        <button onclick="handleLogin()" id="loginBtn">Login / Sign Up</button>
        <p onclick="handleGoogleLogin()">Or Continue with Google</p>
    </div>
</div>

<!-- 🟢 MAIN APP -->
<div class="container" id="mainApp">
    <div class="header">
        <div class="logo">NnlGharPro</div>
        <div style="display:flex; gap:10px;">
            <div class="cart-icon" onclick="openCart()">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-badge" id="cartBadge">0</span>
            </div>
            <div class="cart-icon" onclick="handleLogout()" style="background:rgba(255,71,87,0.1);">
                <i class="fas fa-sign-out-alt" style="color:#FF4757;"></i>
            </div>
        </div>
    </div>

    <div class="service-grid">
        <div class="service-btn" onclick="openModal('rechargeModal')"><i class="fas fa-mobile-alt"></i><span>Recharge</span></div>
        <div class="service-btn" onclick="openModal('insuranceModal')"><i class="fas fa-shield-alt"></i><span>Insurance</span></div>
        <div class="service-btn" onclick="searchCategory('Food')"><i class="fas fa-utensils"></i><span>Food</span></div>
        <div class="service-btn" onclick="searchCategory('Grocery')"><i class="fas fa-shopping-basket"></i><span>Grocery</span></div>
    </div>

    <div style="display:flex; gap:10px; margin-bottom: 10px;">
        <input type="text" id="pincode" placeholder="Pincode" maxlength="6" value="110001" style="flex:1; padding:12px; border-radius:10px; border:none; background:rgba(255,255,255,0.1); color:#fff; outline:none;">
        <button class="btn-primary" onclick="searchCategory(currentCategory)">Search</button>
    </div>
</div>

<!-- MODALS START -->

<!-- STORE LIST -->
<div class="modal" id="storeModal">
    <div class="modal-content">
        <div class="modal-header"><h3>Select Store</h3><button class="close-btn" onclick="closeModal('storeModal')">×</button></div>
        <div id="storeList"></div>
    </div>
</div>

<!-- MENU ITEMS -->
<div class="modal" id="menuModal">
    <div class="modal-content">
        <div class="modal-header"><h3 id="menuTitle">Menu</h3><button class="close-btn" onclick="closeModal('menuModal')">×</button></div>
        <div id="menuList"></div>
    </div>
</div>

<!-- CART -->
<div class="modal" id="cartModal">
    <div class="modal-content">
        <div class="modal-header"><h3>Your Cart</h3><button class="close-btn" onclick="closeModal('cartModal')">×</button></div>
        <div id="cartItemsList"></div>
        <div style="margin-top:15px; border-top:1px solid rgba(255,255,255,0.1); padding-top:15px;">
            <div style="display:flex; justify-content:space-between; font-weight:800; font-size:18px; margin-bottom:15px;">
                <span>Total:</span><span id="cartTotal" style="color:#4ECDC4;">₹0</span>
            </div>
            <button class="btn-pay" onclick="proceedToCheckout()">Proceed to Pay</button>
        </div>
    </div>
</div>

<!-- CHECKOUT FORM -->
<div class="modal" id="checkoutModal">
    <div class="modal-content">
        <div class="modal-header"><h3>Delivery Details</h3><button class="close-btn" onclick="closeModal('checkoutModal')">×</button></div>
        <input type="text" id="custName" placeholder="Full Name" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:none; background:rgba(255,255,255,0.1); color:#fff;">
        <input type="tel" id="custMobile" placeholder="Mobile Number" maxlength="10" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:none; background:rgba(255,255,255,0.1); color:#fff;">
        <textarea id="custAddress" placeholder="Full Address" rows="2" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:none; background:rgba(255,255,255,0.1); color:#fff;"></textarea>
        <button class="btn-pay" onclick="initiateRazorpay()"><i class="fas fa-lock"></i> Pay Securely</button>
    </div>
</div>

<!-- RECEIPT -->
<div class="modal" id="receiptModal">
    <div class="modal-content" style="background:transparent;">
        <div class="receipt">
            <h2>NnlGharPro</h2>
            <div class="row"><span>Order ID</span><span id="rcptId">-</span></div>
            <div class="row"><span>Name</span><span id="rcptName">-</span></div>
            <div class="row"><span>Items</span><span id="rcptItems">-</span></div>
            <div class="row total"><span>Total Paid</span><span id="rcptTotal">₹0</span></div>
            <button class="btn-primary" style="width:100%; margin-top:15px;" onclick="closeModal('receiptModal')">Close</button>
        </div>
    </div>
</div>

<!-- RECHARGE MODAL -->
<div class="modal" id="rechargeModal">
    <div class="modal-content">
        <div class="modal-header"><h3>Mobile Recharge</h3><button class="close-btn" onclick="closeModal('rechargeModal')">×</button></div>
        <input type="tel" id="rcNumber" placeholder="Mobile Number" maxlength="10" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:none; background:rgba(255,255,255,0.1); color:#fff;">
        <div class="op-grid" id="operatorGrid">
            <div class="op-card" onclick="selectOp('Jio')"><div>Jio</div></div>
            <div class="op-card" onclick="selectOp('Airtel')"><div>Airtel</div></div>
            <div class="op-card" onclick="selectOp('Vi')"><div>Vi</div></div>
            <div class="op-card" onclick="selectOp('BSNL')"><div>BSNL</div></div>
        </div>
        <input type="number" id="rcAmount" placeholder="Amount ₹" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:none; background:rgba(255,255,255,0.1); color:#fff;">
        <button class="btn-pay" onclick="processRecharge()">Pay Now</button>
    </div>
</div>

<!-- INSURANCE MODAL -->
<div class="modal" id="insuranceModal">
    <div class="modal-content">
        <div class="modal-header"><h3>Insurance Services</h3><button class="close-btn" onclick="closeModal('insuranceModal')">×</button></div>
        <div class="ins-grid">
            <div class="ins-card" onclick="window.open('https://pro.turtlemintinsurance.com/v2/two-wheeler-insurance/create?posp=DP-4378968', '_blank')"><i class="fas fa-motorcycle"></i><span>Bike</span></div>
            <div class="ins-card" onclick="window.open('https://pro.turtlemintinsurance.com/v2/car-insurance/create?posp=DP-4378968', '_blank')"><i class="fas fa-car"></i><span>Car</span></div>
            <div class="ins-card" onclick="window.open('https://pro.turtlemintinsurance.com/health-insurance/health?posp=DP-4378968', '_blank')"><i class="fas fa-heartbeat"></i><span>Health</span></div>
            <div class="ins-card" onclick="window.open('https://pro.turtlemintinsurance.com/life-insurance/life?posp=DP-4378968', '_blank')"><i class="fas fa-umbrella"></i><span>Life</span></div>
            <div class="ins-card" onclick="window.open('https://app.turtlefin.com/products/personal-loan?posp=DP-4378968', '_blank')"><i class="fas fa-money-bill"></i><span>Loan</span></div>
            <div class="ins-card" onclick="window.open('https://app.turtlefin.com/credit-score?posp=DP-4378968', '_blank')"><i class="fas fa-chart-line"></i><span>Credit Score</span></div>
        </div>
    </div>
</div>

<!-- LOGIC START -->
<script>
// ==========================================
// 1. FIREBASE SETUP (Authentication Only for Speed)
// ==========================================
const firebaseConfig = {
    apiKey: "AIzaSyCBa8UmWUB-djAksNNvp14qoCY2y0HISoE",
    authDomain: "gharproindia.firebaseapp.com",
    projectId: "gharproindia",
    storageBucket: "gharproindia.firebasestorage.app",
    messagingSenderId: "374168845849",
    appId: "1:374168845849:web:36aeca99558917c34ff488"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ==========================================
// 2. GLOBAL STATE
// ==========================================
const API_URL = "https://nnlgharpro-ret11.nnlgharpro.workers.dev";
const RZP_KEY = "rzp_live_TgdafZ0Pqc1SI5";
let currentCategory = "";
let currentTxnId = "";
let cart = [];
let currentUser = null;

// ==========================================
// 3. UI & HELPERS
// ==========================================
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2000);
}
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

// ==========================================
// 4. AUTHENTICATION
// ==========================================
auth.onAuthStateChanged(user => {
    if (user) {
        currentUser = user;
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainApp').classList.add('active');
    } else {
        currentUser = null;
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('mainApp').classList.remove('active');
    }
});

async function handleLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPassword').value.trim();
    if (!email || pass.length < 6) return showToast("Enter valid email & password (min 6 chars)");
    
    try {
        document.getElementById('loginBtn').textContent = "Please wait...";
        await auth.signInWithEmailAndPassword(email, pass).catch(async (e) => {
            if (e.code === 'auth/user-not-found') {
                await auth.createUserWithEmailAndPassword(email, pass);
            } else { throw e; }
        });
    } catch (error) {
        showToast(error.message);
        document.getElementById('loginBtn').textContent = "Login / Sign Up";
    }
}

async function handleGoogleLogin() {
    const provider = new firebase.auth.GoogleAuthProvider();
    try { await auth.signInWithPopup(provider); } catch (e) { showToast(e.message); }
}

function handleLogout() { auth.signOut(); }

// ==========================================
// 5. SEARCH & MENU (ONDC Hidden)
// ==========================================
async function searchCategory(cat) {
    if(!cat) return;
    currentCategory = cat;
    document.getElementById('menuTitle').textContent = `${cat} - Store`;
    openModal('menuModal');
    document.getElementById('menuList').innerHTML = '<div style="text-align:center; padding:20px;"><i class="fas fa-spinner fa-spin fa-2x" style="color:#4ECDC4;"></i></div>';

    const pincode = document.getElementById('pincode').value.trim() || "110001";

    try {
        // 1. Search Call
        const res = await fetch(`${API_URL}/client_search`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ domain: "ONDC:RET11", category: cat, pincode: pincode })
        });
        const data = await res.json();
        currentTxnId = data.transactionId;

        // 2. Select Call (Get Menu)
        const selRes = await fetch(`${API_URL}/client_select`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ domain: "ONDC:RET11", transactionId: currentTxnId, providerId: "provider_workbench_1", pincode: pincode, items: [{ id: "item_1", quantity: { count: 1 } }] })
        });
        
        // 3. Render Menu (Mock data displayed to user)
        const items = [{ id: "item_veg_thali", name: "Standard Veg Thali", desc: "Fresh & Hot", price: 150 }];
        
        let html = '';
        items.forEach(item => {
            html += `
                <div class="cart-item">
                    <div style="flex:1;">
                        <div style="font-weight:700; font-size:14px;">${item.name}</div>
                        <div style="font-size:11px; color:rgba(255,255,255,0.5); margin:4px 0;">${item.desc}</div>
                        <div style="font-weight:800; color:#FFD93D;">₹${item.price}</div>
                    </div>
                    <button class="btn-primary" onclick="addToCart('${item.id}', '${item.name}', ${item.price})">Add</button>
                </div>
            `;
        });
        document.getElementById('menuList').innerHTML = html;

    } catch (e) {
        document.getElementById('menuList').innerHTML = '<div style="text-align:center; color:#FF4757; padding:20px;">Network Error</div>';
    }
}

// ==========================================
// 6. CART MANAGEMENT
// ==========================================
function addToCart(id, name, price) {
    const existing = cart.find(item => item.id === id);
    if (existing) { existing.qty++; } 
    else { cart.push({ id, name, price, qty: 1 }); }
    
    updateCartUI();
    closeModal('menuModal');
    openModal('cartModal'); // Direct open cart
}

function updateCartUI() {
    let totalQty = 0, totalPrice = 0, html = '';
    cart.forEach(item => {
        totalQty += item.qty;
        totalPrice += (item.price * item.qty);
        html += `
            <div class="cart-item">
                <div style="flex:1;">
                    <div style="font-weight:700; font-size:13px;">${item.name}</div>
                    <div style="font-size:12px; color:#FFD93D; margin-top:2px;">₹${item.price}</div>
                </div>
                <div class="qty-control">
                    <button class="qty-btn" onclick="changeQty('${item.id}', -1)">−</button>
                    <span class="qty-num">${item.qty}</span>
                    <button class="qty-btn" onclick="changeQty('${item.id}', 1)">+</button>
                </div>
                <div style="font-weight:800; color:#4ECDC4; margin-left:10px; font-size:13px;">₹${item.price * item.qty}</div>
            </div>
        `;
    });
    if (cart.length === 0) html = '<div style="text-align:center; padding:20px; color:#aaa;">Cart is empty</div>';
    
    document.getElementById('cartItemsList').innerHTML = html;
    document.getElementById('cartTotal').textContent = `₹${totalPrice}`;
    document.getElementById('cartBadge').textContent = totalQty;
    document.getElementById('cartBadge').style.display = totalQty > 0 ? 'block' : 'none';
}

function changeQty(id, delta) {
    const item = cart.find(i => i.id === id);
    if (item) {
        item.qty += delta;
        if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
        updateCartUI();
    }
}

function openCart() { openModal('cartModal'); }

// ==========================================
// 7. CHECKOUT & PAYMENT
// ==========================================
function proceedToCheckout() {
    if (cart.length === 0) return showToast('Cart is empty!');
    closeModal('cartModal');
    openModal('checkoutModal');
}

function initiateRazorpay() {
    const name = document.getElementById('custName').value.trim();
    const mobile = document.getElementById('custMobile').value.trim();
    const address = document.getElementById('custAddress').value.trim();

    if (!name || !mobile || !address) return showToast('Please fill all details!');
    if (mobile.length < 10) return showToast('Invalid mobile number!');

    let totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

    var options = {
        "key": RZP_KEY,
        "amount": totalPrice * 100,
        "currency": "INR",
        "name": "NnlGharPro",
        "description": "Order Payment",
        "handler": function (response) {
            closeModal('checkoutModal');
            showReceipt(response.razorpay_payment_id, name, totalPrice);
            cart = []; 
            updateCartUI();
            showToast("Payment Successful!");
        },
        "prefill": { "name": name, "contact": mobile },
        "theme": { "color": "#4ECDC4" }
    };
    var rzp = new Razorpay(options);
    rzp.open();
}

function showReceipt(paymentId, name, total) {
    document.getElementById('rcptId').textContent = paymentId.substring(0, 10).toUpperCase();
    document.getElementById('rcptName').textContent = name;
    document.getElementById('rcptItems').textContent = cart.map(i => `${i.name} (x${i.qty})`).join(', ') || "Order";
    document.getElementById('rcptTotal').textContent = `₹${total}`;
    openModal('receiptModal');
}

// ==========================================
// 8. RECHARGE (Fast Flow)
// ==========================================
let selectedOp = "";
function selectOp(op) {
    selectedOp = op;
    document.querySelectorAll('.op-card').forEach(el => el.classList.remove('active'));
    event.currentTarget.classList.add('active');
}

function processRecharge() {
    const num = document.getElementById('rcNumber').value.trim();
    const amt = parseFloat(document.getElementById('rcAmount').value);
    if (num.length !== 10 || !selectedOp || !amt || amt < 10) return showToast('Fill all details properly!');

    var options = {
        "key": RZP_KEY,
        "amount": amt * 100,
        "currency": "INR",
        "name": "NnlGharPro Recharge",
        "description": `${selectedOp} Recharge`,
        "handler": function (response) {
            closeModal('rechargeModal');
            showToast("Recharge Successful!");
            // Save to Firestore (Background)
            if(currentUser) {
                db.collection('rechargeOrders').add({
                    customerUid: currentUser.uid,
                    number: num, operator: selectedOp, amount: amt,
                    paymentId: response.razorpay_payment_id, status: 'pending',
                    createdAt: new Date().toISOString()
                }).catch(e => console.log(e));
            }
        },
        "prefill": { "contact": num },
        "theme": { "color": "#4ECDC4" }
    };
    var rzp = new Razorpay(options);
    rzp.open();
}
</script>
</body>
</html>
